<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="jelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAF3F"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF6B00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Icono de marca JuegaEnLinea -->
  <g transform="translate(15, 12)" filter="url(#glow)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#jelGrad)"/>
    <!-- Flecha Play estilizada con dados -->
    <path d="M 21 16 L 39 28 L 21 40 Z" fill="#FFFFFF"/>
    <circle cx="34" cy="20" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="34" cy="36" r="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Tipografía Oficial -->
  <g transform="translate(85, 42)">
    <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      JUEGA
    </text>
    <text x="110" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="url(#goldGrad)" letter-spacing="1">
      ENLÍNEA
    </text>
    <text x="0" y="18" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="3">
      PATROCINADOR OFICIAL
    </text>
  </g>
</svg>
